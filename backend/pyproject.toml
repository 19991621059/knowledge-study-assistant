[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-study-assistant"
version = "0.1.0"
description = "可自部署、资料与模型由用户配置的知识库学习助手"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
    "cryptography>=46,<51", "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7", "python-docx>=1.2,<2", "tzdata>=2025.1,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["study_assistant*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
